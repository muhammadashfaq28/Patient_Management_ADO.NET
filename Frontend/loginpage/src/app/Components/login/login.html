<div class="login-container">

  <!-- Left Side -->
  <div class="login-left">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">PatientCare</span>
    </div>
    <h1>Welcome back 👋</h1>
    <p>Manage your patients efficiently with our smart dashboard.</p>
    <div class="features">
      <div class="feat"><div class="feat-icon">✓</div> Patient records</div>
      <div class="feat"><div class="feat-icon">✓</div> Quick updates</div>
      <div class="feat"><div class="feat-icon">✓</div> Secure access</div>
    </div>
  </div>

  <!-- Right Side -->
  <div class="login-right">
    <h2>Sign in</h2>
    <p class="sub">Enter your credentials to continue</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="userName" name="userName" required placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter password" />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
  </div>

</div>
