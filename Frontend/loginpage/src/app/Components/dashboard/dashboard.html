<div class="dashboard-container">

  <!-- Header -->
  <div class="header">
    <h2>Dashboard</h2>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <!-- Button -->
  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <button (click)="loadPatients()">Get Patients</button>
      <button (click)="showAdd()">Add Patient</button>
      <button (click)="showUpdate()">Update Patient</button>
      <button (click)="showDelete()">Delete Patient</button>
    </div>

    <!-- Content -->
    <div class="content">

      @if (view === 'patients') {
      <table class="patient-table">
        @for (p of patients; track p.patientId) {
        <tr>
          <td>{{ p.patientId }}</td>
          <td>{{ p.patientName }}</td>
          <td>{{ p.city }}</td>
          <td>{{ p.email }}</td>
          <td>
            <button class="edit-btn" (click)="editPatient(p)">Edit</button>
          </td>
        </tr>
        }
      </table>
      }

      @if (view === 'add') {
      <form [formGroup]="addForm" (ngSubmit)="addPatient()" class="form-container">

        <h3>Add Patient</h3>

        <input placeholder="First Name" formControlName="firstName">
        <input placeholder="Last Name" formControlName="lastName">
        <input placeholder="Gender" formControlName="gender">
        <input type="date" formControlName="dateOfBirth">
        <input placeholder="City" formControlName="city">
        <input placeholder="Phone Number" formControlName="phoneNumber">
        <input placeholder="Email" formControlName="email">

        <button type="submit" [disabled]="addForm.invalid">Add Patient</button>

      </form>
      }

      @if (view === 'update') {
      <div class="form-container">

        <h3>Update Patient</h3>

        <form [formGroup]="updateForm" (ngSubmit)="updatePatient()" class="form-container">

          <input formControlName="firstName" placeholder="First Name">
          <input formControlName="lastName" placeholder="Last Name">
          <input formControlName="gender" placeholder="Gender">
          <input type="date" formControlName="dateOfBirth">
          <input formControlName="city" placeholder="City">
          <input formControlName="phoneNumber" placeholder="Phone Number">
          <input formControlName="email" placeholder="Email">

          <button type="submit">Update</button>

        </form>

      </div>
      }

      @if (view === 'delete') {
      <p>Delete UI Here</p>
      }

    </div>

  </div>
</div>
